<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/finsight-design-system-e79c280c-6dd2-4b0e-a5eb-f14f2983571a/_ds_bundle.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{
  "layout": "grid"
}/*EDITMODE-END*/;
const KEY='finsight-proto-v1';
const DEMO_A={id:'a1',title:'2026년 9월',files:[FS_FILES.card],srcs:['card'],created:'2026.10.01'};
const SAMPLE_A={id:'sample',title:'2026년 9월',files:[FS_FILES.card,FS_FILES.bank,FS_FILES.card2],srcs:['card','bank','card2'],created:'샘플'};
const INIT={route:'landing',user:null,analyses:[],cur:null,ins:{},pending:false,verifyEmail:''};
function App(){
const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);
const [s,setS]=React.useState(()=>{try{return {...INIT,...JSON.parse(localStorage.getItem(KEY))}}catch(e){return INIT}});
const [toastMsg,setToast]=React.useState(null);const [upFiles,setUpFiles]=React.useState([]);
const up=p=>setS(o=>({...o,...p}));
React.useEffect(()=>{localStorage.setItem(KEY,JSON.stringify(s));},[s]);
const toast=m=>{setToast(m);setTimeout(()=>setToast(null),2600);};
const go=(route,anchor)=>{let r=route;if(!s.user&&['dashboard','settings','upload','result','checkout'].includes(r))r='login';if(r==='analyzing'&&!upFiles.length)r='upload';up({route:r});setTimeout(()=>{const el=anchor&&document.getElementById(anchor);window.scrollTo(0,el?el.offsetTop-70:0);},20);};
const login=(email,fresh)=>{up({user:{email,plan:'free',used:fresh?0:1},analyses:fresh?[]:[DEMO_A],route:'dashboard',ins:{},pending:false});window.scrollTo(0,0);};
React.useEffect(()=>{if(!s.pending)return;const id=setTimeout(()=>{setS(o=>({...o,pending:false,user:{...o.user,plan:'pro'}}));toast('Pro가 적용되었습니다. 기존 분석의 Pro 기능도 열렸습니다.');},3200);return()=>clearTimeout(id);},[s.pending]);
const gen=id=>{up({ins:{...s.ins,[id]:'loading'}});setTimeout(()=>setS(o=>({...o,ins:{...o.ins,[id]:'done'}})),2200);};
let route=s.route;if(!s.user&&['dashboard','settings','upload','result','checkout','analyzing'].includes(route))route='login';if(route==='analyzing'&&!upFiles.length)route='upload';
const a=s.analyses.find(x=>x.id===s.cur);
const pro=s.user&&s.user.plan==='pro';
let body;
if(route==='landing')body=<Landing go={go} user={s.user}/>;
else if(route==='login')body=<Login go={go} onLogin={login}/>;
else if(route==='signup')body=<Signup go={go} onLogin={login} onVerifySent={e=>up({verifyEmail:e,route:'verify'})}/>;
else if(route==='verify')body=<VerifySent go={go} email={s.verifyEmail} onLogin={login}/>;
else if(route==='reset')body=<Reset go={go}/>;
else if(route==='sample')body=<>{s.user?<AppHeader user={s.user} route="result" go={go} onLogout={()=>up({...INIT})}/>:<PublicHeader go={go} user={s.user}/>}<Result a={SAMPLE_A} pro={true} go={go} layout={t.layout} sample ins="done"/></>;
else if(route==='checkout')body=<Checkout go={go} user={s.user} onPaid={()=>{up({pending:true,route:'dashboard'});window.scrollTo(0,0);}}/>;
else{let inner;
if(route==='dashboard')inner=<Dashboard user={s.user} analyses={s.analyses} go={go} pending={s.pending} open={id=>{up({cur:id,route:'result'});window.scrollTo(0,0);}}/>;
else if(route==='upload')inner=<Upload user={s.user} analyses={s.analyses} go={go} onStart={f=>{setUpFiles(f);up({route:'analyzing'});}}/>;
else if(route==='analyzing')inner=<Analyzing files={upFiles} onDone={()=>{const id='a'+Date.now();const na={id,title:'2026년 9월',files:upFiles.map(f=>f.name),srcs:upFiles.map(f=>f.src),created:'2026.10.01'};setS(o=>({...o,analyses:[na,...o.analyses],cur:id,route:'result',user:{...o.user,used:o.user.used+1}}));setUpFiles([]);window.scrollTo(0,0);}}/>;
else if(route==='result'&&a)inner=<Result a={a} pro={pro} go={go} layout={t.layout} ins={s.ins[a.id]||'idle'} onGenerate={()=>gen(a.id)}/>;
else if(route==='settings')inner=<Settings user={s.user} analyses={s.analyses} go={go} toast={toast} onDelete={id=>up({analyses:s.analyses.filter(x=>x.id!==id)})} onWithdraw={()=>{up({...INIT});toast('탈퇴가 완료되었습니다.');}}/>;
else inner=<Dashboard user={s.user} analyses={s.analyses} go={go} pending={s.pending} open={id=>up({cur:id,route:'result'})}/>;
body=<><AppHeader user={s.user} route={route} go={go} onLogout={()=>{up({...INIT});}}/>{inner}</>;}
return <div data-screen-label={route}>{body}{toastMsg&&<div className="fs-toast">{toastMsg}</div>}
<TweaksPanel><TweakSection label="결과 화면 레이아웃"/><TweakRadio label="레이아웃" value={t.layout} options={['report','split','grid']} onChange={v=>setTweak('layout',v)}/>
<TweakSection label="바로가기"/><TweakButton label="샘플 결과 보기" onClick={()=>go('sample')}/><TweakButton label="데모 초기화" onClick={()=>{setS(INIT);window.scrollTo(0,0);}}/></TweaksPanel></div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
